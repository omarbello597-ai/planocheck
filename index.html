<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<title>PlanoCheck · Category Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0b3d2e; --green2:#0f5a3f; --green-l:#1c6647; --lime:#b6e62e; --lime-d:#8fbf1f;
  --ink:#13201a; --paper:#f4f1e9; --card:#ffffff; --muted:#6b7d74;
  --red:#c0392b; --amber:#e08a12; --ok:#1c8a5a; --line:rgba(11,61,46,.12);
  --shadow:0 2px 14px rgba(11,61,46,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.5;overscroll-behavior:none}
.hidden{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* top bar */
.topbar{background:var(--green);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .logo{font-family:'Archivo Narrow';font-weight:700;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
.topbar .logo b{color:var(--lime)}
.topbar .sp{flex:1}
.topbar button{background:rgba(255,255,255,.12);border:0;color:#fff;padding:7px 10px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.crumbs{font-size:12px;color:var(--muted);padding:10px 18px 0;font-weight:600;text-transform:uppercase;letter-spacing:.4px}

.scroll{flex:1;overflow-y:auto;padding:16px 18px 120px}

/* cards / inputs */
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
h2{font-size:17px;font-weight:700;margin-bottom:10px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--green);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;
  font-family:inherit;background:#fcfbf7;color:var(--ink);transition:border .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--lime-d)}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#fff}
.btn-lime{background:var(--lime);color:var(--green)}
.btn-ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-top:10px}

/* cuerpos selector */
.cuerpos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.cuerpo-opt{border:2px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;background:#fcfbf7;transition:all .15s}
.cuerpo-opt.sel{border-color:var(--green);background:#eef6f1}
.cuerpo-opt .big{font-size:34px;font-weight:800;color:var(--green);line-height:1}
.cuerpo-opt .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.cuerpo-opt .dif{font-size:11px;font-weight:700;color:var(--lime-d);margin-top:3px;text-transform:uppercase}

/* photo */
.photo-box{border:2px dashed var(--line);border-radius:13px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;background:#fcfbf7;font-size:14px;font-weight:600}
.photo-box img{max-width:100%;border-radius:9px;margin-top:8px}

/* checklist */
.lvl-head{font-family:'Archivo Narrow';font-weight:700;font-size:15px;color:var(--green);text-transform:uppercase;
  letter-spacing:.5px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--lime);display:flex;justify-content:space-between}
.lvl-head span{color:var(--muted);font-size:12px}
.prod{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod .meta{flex:1;min-width:0}
.prod .nm{font-size:14px;font-weight:600;line-height:1.25}
.prod .det{font-size:12px;color:var(--muted);margin-top:2px}
.prod .brand{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#eef6f1;color:var(--green-l);text-transform:uppercase;margin-right:5px}
.chk{display:flex;gap:6px;flex-shrink:0}
.chk button{width:42px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:18px;cursor:pointer;font-weight:700;color:var(--muted)}
.chk button.yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk button.no.on{background:var(--red);border-color:var(--red);color:#fff}
.motivo{margin-top:8px}
.motivo select{font-size:14px;padding:9px 11px}

/* score */
.scorewrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
.score{border-radius:15px;padding:18px;text-align:center;color:#fff}
.score .v{font-size:40px;font-weight:800;line-height:1}
.score .l{font-size:12px;font-weight:600;opacity:.92;margin-top:4px;text-transform:uppercase;letter-spacing:.3px}
.score.adj{background:var(--green)}
.score.nov{background:var(--green-l)}
.statepill{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:12px}
.statepill.ok{background:#e3f3ea;color:var(--ok)}
.statepill.warn{background:#fdf0db;color:var(--amber)}

/* plan de accion */
.action{display:flex;gap:11px;padding:12px;border-radius:12px;background:#fcfbf7;border:1px solid var(--line);margin-bottom:9px;align-items:flex-start}
.action .rank{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--green);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action .txt{flex:1;font-size:14px}
.action .txt b{font-weight:700}
.action .imp{font-size:12px;color:var(--lime-d);font-weight:700;margin-top:3px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90%}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;
  background:linear-gradient(160deg,var(--green) 0%,#06291e 100%);color:#fff}
.login .brand{font-family:'Archivo Narrow';font-weight:700;font-size:32px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.login .brand b{color:var(--lime)}
.login .tag{color:rgba(255,255,255,.7);font-size:15px;margin-bottom:32px}
.login label{color:rgba(255,255,255,.85)}
.login input{background:rgba(255,255,255,.95);border:0}
.login .btn{margin-top:22px}
.login .switch{text-align:center;color:rgba(255,255,255,.8);font-size:14px;margin-top:18px;cursor:pointer}
.login .switch b{color:var(--lime)}
.login .note{background:rgba(255,255,255,.1);border-radius:11px;padding:12px;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:20px;line-height:1.5}

.admtabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.admtab{flex:1;background:none;border:0;padding:10px 4px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.admtab.on{color:var(--green);border-bottom-color:var(--lime)}
.admrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.admrow:last-child{border-bottom:0}
.admrow-main{flex:1;min-width:0}
.admrow-nm{font-size:14px;font-weight:700}
.admrow-det{font-size:12px;color:var(--muted);margin-top:2px}
.admrow-acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.mini{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--green);cursor:pointer;text-decoration:none;display:inline-block}
.mini.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini.no{background:#fff;color:var(--red);border-color:var(--red)}
.mini-sel{font-size:11px;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:#fcfbf7}

.prodmini{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.prodmini:last-child{border-bottom:0}
.prodmini em{color:var(--muted);font-style:normal;font-weight:600}
.timeline{margin-top:14px}
.tl{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tl span{color:var(--muted)}
.tl b{color:var(--green);font-weight:700}
.fixedbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;padding:14px 18px;
  background:linear-gradient(transparent,var(--paper) 22%);z-index:15}
.copyr{text-align:center;font-size:11.5px;color:rgba(255,255,255,.55);margin-top:26px;letter-spacing:.4px}.copyr b{color:rgba(182,230,46,.85);font-weight:600}
.copyr-app{text-align:center;font-size:11px;color:var(--muted);padding:18px 0 8px;letter-spacing:.3px}.copyr-app b{color:var(--green-l);font-weight:600}
.banner{background:#fdf0db;border:1px solid var(--amber);color:#7a4a06;padding:11px 14px;border-radius:11px;font-size:13px;font-weight:600;margin-bottom:14px}
</style>
</head>

<div class="app">
  <!-- LOGIN -->
  <div id="screen-login" class="login">
    <div class="brand">Plano<b>Check</b></div>
    <div class="tag">Category Management · Validación de planogramas</div>
    <div id="cfgBanner" class="note" style="background:rgba(192,57,43,.25)"></div>
    <label>Correo</label>
    <input id="li-email" type="email" placeholder="tu@correo.com" autocomplete="email">

  <div id="screen-app" class="hidden" style="display:flex;flex-direction:column;min-height:100vh">

  <div id="toast" class="toast hidden"></div>
</div>

  } else if(st==='en_implementacion'){
    body=`<div class="card">
      <span class="statepill warn">⏱ Implementación en curso</span>
      <div class="sub">Iniciada ${new Date(ficha.t_impl_ini).toLocaleTimeString()}. Cuando termines de acomodar el lineal, finaliza y sube la foto del DESPUÉS.</div>
      <div class="photo-box" onclick="document.getElementById('fd').click()" id="boxDesp">📷 Foto del DESPUÉS</div>
      <input id="fd" type="file" accept="image/*" capture="environment" class="hidden" onchange="prevFoto(this,'boxDesp',v=>ficha._fotoTmp=v)">
    </div>
    <div class="fixedbar"><button class="btn btn-primary" onclick="finalizarImpl()">■ Finalizar implementación</button></div>`;
  } else if(st==='en_ajustes'){
    body=`<div class="card">
      <span class="statepill warn">⏱ Ajustes en curso</span>
      <div class="sub">Iniciados ${new Date(ficha.t_aj_ini).toLocaleTimeString()}. Realiza los ajustes del plan de acción y sube la nueva foto del DESPUÉS.</div>
      <div class="photo-box" onclick="document.getElementById('fd2').click()" id="boxDesp2">📷 Nueva foto del DESPUÉS</div>
      <input id="fd2" type="file" accept="image/*" capture="environment" class="hidden" onchange="prevFoto(this,'boxDesp2',v=>ficha._fotoTmp=v)">
    </div>
    <div class="fixedbar"><button class="btn btn-primary" onclick="finalizarAjustes()">✓ Ajustes realizados</button></div>`;
  } else if(st==='ajustes_pendientes'){
    body=`<div class="card">
      <span class="statepill warn">Ajustes pendientes de visita anterior</span>
      <div class="sub">Esta tienda quedó con ajustes por hacer. Calificación vigente: Ajustada ${ficha.calif_ajustada||0}% / Novedades ${ficha.calif_novedades||0}%. Retoma los ajustes cuando estés lista.</div>
    </div>

/* ---------- Calificación ---------- */
window.calcScore=function(){
  const prods=PLANO[visit.dif].productos;
  let presR=0,totR=0,presW=0,totW=0,justW=0; const faltantes=[];
  prods.forEach(p=>{ const id=p.ean+'_'+p.nivel+'_'+p.posicion; const w=p.pond_norm||0;
    const present=visit.checks[id]===true; totR++; totW+=w;
    if(present){presR++;presW+=w;}
    else{ const mot=visit.motivos[id]||''; const just=MOTIVOS_JUST.includes(mot);
      if(just) justW+=w; faltantes.push({...p,mot,just,w}); }
  });
  const novedades=totR?presR/totR*100:0;
  const ajustada=presW/((totW-justW)||1)*100;
  const apto=ajustada>=90;
  const plan=faltantes.filter(f=>!f.just).sort((a,b)=>b.w-a.w);
  ficha.checks=visit.checks; ficha.motivos=visit.motivos;
  ficha.calif_ajustada=Number(ajustada.toFixed(1)); ficha.calif_novedades=Number(novedades.toFixed(1));
  window._score={apto,ajustada,novedades,plan,faltJust:faltantes.filter(f=>f.just)};

  document.getElementById('crumbs').textContent='Implementación › Resultado';
  let html=`<div class="card">
    <span class="statepill ${apto?'ok':'warn'}">${apto?'✓ Apto para ejecutada (≥90%)':'⚠ Por hacer mejoras (<90%)'}</span>
    <div class="scorewrap">
      <div class="score adj"><div class="v">${ajustada.toFixed(0)}%</div><div class="l">Calif. Ajustada</div></div>
      <div class="score nov"><div class="v">${novedades.toFixed(0)}%</div><div class="l">Calif. Novedades</div></div>
    </div>
    <div class="timeline">
      <div class="tl"><span>⏱ Implementación</span><b>${fmtDur(ficha.ms_impl)}</b></div>
      ${ficha.ms_ajustes?`<div class="tl"><span>⏱ Ajustes acumulados</span><b>${fmtDur(ficha.ms_ajustes)}</b></div>`:''}
    </div>
  </div>`;
  if(plan.length){
    html+=`<div class="card"><h2>Plan de acción</h2><div class="sub">Ordenado por impacto en ventas.</div>`;
    plan.forEach((f,i)=>{ const imp=f.w>0?`+${(f.w*100).toFixed(1)}% del lineal en ventas`:'sin venta registrada';
      html+=`<div class="action"><div class="rank">${i+1}</div><div class="txt"><b>Agrega ${f.descripcion}</b> en ${f.nivel}, pos. ${f.posicion} (${f.caras} cara/s).<div class="imp">${imp}</div></div></div>`; });
    html+=`</div>`;
  }
  const justFalt=window._score.faltJust;
  if(justFalt.length){
    html+=`<div class="card"><h2>Reporte de agotados / sin espacio</h2><div class="sub">No penalizan la calificación.</div>`;
    justFalt.forEach(f=>{html+=`<div class="action"><div class="txt"><b>${f.descripcion}</b><div class="imp" style="color:var(--amber)">${f.mot}</div></div></div>`;});
    html+=`</div>`;
  }
  // acciones según resultado
  html+=`<div class="fixedbar">`;
  if(apto){
    html+=`<button class="btn btn-lime" onclick="guardarFicha('pendiente_aprobacion')">Guardar · enviar a aprobación</button>`;
  } else {
    html+=`<button class="btn btn-primary" onclick="iniciarAjustes()">▶ Iniciar ajustes ahora</button>`;
    html+=`<button class="btn btn-ghost" onclick="aplazarAjustes()">Dejar ajustes para la siguiente visita</button>`;
  }
  html+=`</div>`;
  document.getElementById('content').innerHTML=html;
};

/* ---------- Persistencia ---------- */
async function persistFicha(){
  if(!db){ return true; }
  const {doc,setDoc}=window._fs;
  const {ref,uploadString,getDownloadURL}=window._st;
  try{
    if(ficha.foto_antes && ficha.foto_antes.startsWith('data:')){
      const r=ref(storage,`fichas/${ficha.uid}/${ficha.id}_antes.jpg`); await uploadString(r,ficha.foto_antes,'data_url'); ficha.foto_antes=await getDownloadURL(r);
    }
    if(ficha.foto_despues && ficha.foto_despues.startsWith('data:')){
      const r=ref(storage,`fichas/${ficha.uid}/${ficha.id}_despues.jpg`); await uploadString(r,ficha.foto_despues,'data_url'); ficha.foto_despues=await getDownloadURL(r);
    }
    delete ficha._fotoTmp;
    await setDoc(doc(db,'fichas',ficha.id), ficha);
    return true;
  }catch(e){ toast('Error al guardar: '+(e.code||e.message)); return false; }
}
window.guardarFicha=async function(estado){
  ficha.estado=estado; ficha.actualizado=nowStamp();
  ficha.bitacora.push({fase:estado==='pendiente_aprobacion'?'Enviado a aprobación':estado,ts:nowStamp(),por:ficha.mercaderista,aj:ficha.calif_ajustada,nv:ficha.calif_novedades});
  const ok=await persistFicha();
  if(ok){ toast('✓ Guardado'); renderHome(); }
};

              <option ${u.rol==='admin'?'selected':''}>admin</option>
            </select>
          </div>
        </div>`).join('');
    } else if(adminTab==='visitas'){
      const snap=await getDocs(collection(db,'visitas'));
      let vs=[];snap.forEach(d=>vs.push({id:d.id,...d.data()}));
      vs.sort((a,b)=>(b.fecha||0)-(a.fecha||0));

        </div>`).join('');
    }
  }catch(e){body.innerHTML='<div class="sub">Error: '+(e.code||e.message)+'</div>';}
}

  const {doc,updateDoc}=window._fs;
  try{await updateDoc(doc(db,'visitas',id),{estado:'por_mejoras'});toast('Reabierta');loadAdminTab();}
  catch(e){toast('Error: '+(e.code||e.message));}
};

/* ---------- STEP 1: PDV + cuerpos ---------- */
window.startVisit=function(){
  visit={pdv:null,cuerpos:null,dif:null,checks:{},motivos:{},foto_espacio:null,obs:'',foto_final:null};
  document.getElementById('crumbs').textContent='Nueva visita › Tienda';
  const opts=PDVS.map(p=>`<option value="${p.pdv}">${p.pdv}</option>`).join('');
  document.getElementById('content').innerHTML=`
    <div class="card">
      <h2>1 · Identifica la tienda</h2>
      <label>Punto de venta</label>
      <select id="v-pdv"><option value="">Selecciona...</option>${opts}</select>
      <label>¿Cuántos cuerpos / módulos tiene el lineal de la categoría?</label>
      <div class="cuerpos">
        <div class="cuerpo-opt" id="c1" onclick="pickCuerpo(1)"><div class="big">1</div><div class="lbl">Un cuerpo</div><div class="dif">Difusión 10</div></div>
        <div class="cuerpo-opt" id="c2" onclick="pickCuerpo(2)"><div class="big">2</div><div class="lbl">Dos cuerpos</div><div class="dif">Difusión 20</div></div>
      </div>
      <label>Foto del espacio / lineal completo</label>
      <div class="photo-box" onclick="document.getElementById('v-foto').click()" id="fotoBox">📷 Tomar / subir foto del espacio</div>
      <input id="v-foto" type="file" accept="image/*" capture="environment" class="hidden" onchange="prevFoto(this,'fotoBox','foto_espacio')">
      <label>Observaciones (opcional)</label>
      <textarea id="v-obs" placeholder="Ej: el lineal tuvo reducción de espacio, etc."></textarea>
    </div>
    <div class="fixedbar"><button class="btn btn-primary" id="next1" disabled onclick="goChecklist()">Continuar al checklist →</button></div>`;
  document.getElementById('v-pdv').onchange=validate1;
};
window.pickCuerpo=function(n){
  visit.cuerpos=n; visit.dif=n===1?'difusion_10':'difusion_20';
  document.getElementById('c1').classList.toggle('sel',n===1);
  document.getElementById('c2').classList.toggle('sel',n===2);
  validate1();
};
function validate1(){
  visit.pdv=document.getElementById('v-pdv').value;
  document.getElementById('next1').disabled=!(visit.pdv&&visit.cuerpos);
}
window.prevFoto=function(inp,boxid,key){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=e=>{ visit[key]=e.target.result; document.getElementById(boxid).innerHTML='✓ Foto cargada<br><img src="'+e.target.result+'">'; }; r.readAsDataURL(f);
};

/* ---------- STEP 2: checklist ---------- */
window.goChecklist=function(){
  visit.obs=document.getElementById('v-obs').value;
  document.getElementById('crumbs').textContent='Nueva visita › Checklist';
  const prods=PLANO[visit.dif].productos;
  const niveles=[...new Set(prods.map(p=>p.nivel))];
  let html=`<div class="card"><h2>2 · ¿Qué está implementado?</h2><div class="sub">${visit.pdv} · ${PLANO[visit.dif].nombre}. Marca presente (✓) o ausente (✗) cada producto.</div>`;
  niveles.forEach(nv=>{
    const items=prods.filter(p=>p.nivel===nv);
    html+=`<div class="lvl-head">${nv} <span>${items.length} prod.</span></div>`;
    items.forEach((p,idx)=>{
      const id=p.ean+'_'+nv+'_'+p.posicion;
      html+=`<div class="prod">
        <div class="meta"><div class="nm">${p.descripcion}</div>
          <div class="det"><span class="brand">${p.marca}</span>${p.caras} cara(s) · EAN ${p.ean}</div>
          <div class="motivo hidden" id="mot_${id}">
            <select onchange="setMotivo('${id}',this.value)"><option value="">Motivo de ausencia...</option>${MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select>
          </div>
        </div>
        <div class="chk">
          <button class="yes" id="y_${id}" onclick="setChk('${id}',true)">✓</button>
          <button class="no" id="n_${id}" onclick="setChk('${id}',false)">✗</button>
        </div></div>`;
    });
  });
  html+=`</div><div class="fixedbar"><button class="btn btn-primary" onclick="calcScore()">Calcular calificación →</button></div>`;
  document.getElementById('content').innerHTML=html;
};
window.setChk=function(id,val){
  visit.checks[id]=val;
  document.getElementById('y_'+id).classList.toggle('on',val);
  document.getElementById('n_'+id).classList.toggle('on',!val);
  document.getElementById('mot_'+id).classList.toggle('hidden',val);
  if(val) delete visit.motivos[id];
};
window.setMotivo=function(id,v){ visit.motivos[id]=v; };

/* ---------- STEP 3: score + plan ---------- */
window.calcScore=function(){
  const prods=PLANO[visit.dif].productos;
  let presR=0, totR=0;            // novedades (bruta): cuenta presencia simple
  let presW=0, totW=0, justW=0;   // ajustada: ponderada por ventas, descuenta justificados
  const faltantes=[];
  prods.forEach(p=>{
    const id=p.ean+'_'+p.nivel+'_'+p.posicion;
    const w=p.pond_norm||0;
    const present=visit.checks[id]===true;
    const marked=visit.checks[id]!==undefined;
    totR++; totW+=w;
    if(present){ presR++; presW+=w; }
    else {
      const mot=visit.motivos[id]||'';
      const justified=MOTIVOS_JUST.includes(mot);
      if(justified) justW+=w; // remove from denominator for ajustada
      faltantes.push({...p,mot,justified,w});
    }
  });
  const novedades = totR? (presR/totR*100):0;                       // Calificación Novedades (bruta)
  const denomAdj = (totW-justW)||1;
  const ajustada = ((presW)/denomAdj*100);                          // Calificación Ajustada (ponderada, sin justificados)
  const apto = ajustada>=90;
  // plan de accion: faltantes NO justificados, ordenados por peso de ventas
  const plan = faltantes.filter(f=>!f.justified).sort((a,b)=>b.w-a.w);

  document.getElementById('crumbs').textContent='Nueva visita › Resultado';
  let html=`<div class="card">
    <span class="statepill ${apto?'ok':'warn'}">${apto?'✓ Apto para ejecutada (≥90%)':'⚠ Por hacer mejoras (<90%)'}</span>
    <div class="scorewrap">
      <div class="score adj"><div class="v">${ajustada.toFixed(0)}%</div><div class="l">Calif. Ajustada</div></div>
      <div class="score nov"><div class="v">${novedades.toFixed(0)}%</div><div class="l">Calif. Novedades</div></div>
    </div>
    <div class="sub">Ajustada: ponderada por ventas \$ y descontando faltantes justificados (agotados, sin espacio). Novedades: presencia simple de todos los productos.</div>
  </div>`;

  if(plan.length){
    html+=`<div class="card"><h2>Plan de acción · ${visit.pdv}</h2><div class="sub">Ordenado por impacto en ventas. Surte primero lo de arriba.</div>`;
    plan.forEach((f,i)=>{
      const imp=f.w>0?`+${(f.w*100).toFixed(1)}% del lineal en ventas`:'sin venta registrada';
      html+=`<div class="action"><div class="rank">${i+1}</div><div class="txt">
        <b>Agrega ${f.descripcion}</b> en ${f.nivel}, posición ${f.posicion} (${f.caras} cara/s).
        <div class="imp">${imp}</div></div></div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div class="card"><div class="statepill ok">Sin ajustes pendientes 🎉</div><div class="sub">Todos los faltantes están justificados o el lineal está completo.</div></div>`;
  }

  const justFalt=faltantes.filter(f=>f.justified);
  if(justFalt.length){
    html+=`<div class="card"><h2>Reporte de agotados / sin espacio</h2><div class="sub">No penalizan tu calificación, pero quedan reportados.</div>`;
    justFalt.forEach(f=>{ html+=`<div class="action"><div class="txt"><b>${f.descripcion}</b><div class="imp" style="color:var(--amber)">${f.mot}</div></div></div>`; });
    html+=`</div>`;
  }

  html+=`<div class="card">
    <label>Foto final de la implementación (después)</label>
    <div class="photo-box" onclick="document.getElementById('v-foto2').click()" id="fotoBox2">📷 Foto del lineal terminado</div>
    <input id="v-foto2" type="file" accept="image/*" capture="environment" class="hidden" onchange="prevFoto(this,'fotoBox2','foto_final')">
  </div>
  <div class="fixedbar">
    <button class="btn btn-lime" onclick="saveVisit()">Guardar visita</button>
    <button class="btn btn-ghost" onclick="goChecklist()">← Volver a ajustar</button>
  </div>`;
  document.getElementById('content').innerHTML=html;
  window._lastScore={apto,ajustada,novedades,plan:plan.length,faltJust:justFalt.length};
};

/* ---------- SAVE ---------- */
window.saveVisit=async function(){
  const apto=window._lastScore.apto, ajustada=window._lastScore.ajustada, novedades=window._lastScore.novedades;
  const estado = apto?'pendiente_aprobacion':'por_mejoras';
  const rec={
    pdv:visit.pdv, cuerpos:visit.cuerpos, difusion:visit.dif,
    calif_ajustada:Number(ajustada), calif_novedades:Number(novedades),
    estado, obs:visit.obs, checks:visit.checks, motivos:visit.motivos,
    mercaderista:(PROFILE&&PROFILE.nombre)||'', uid:(USER&&USER.uid)||'demo',
    fecha:Date.now()
  };
  if(!db){ toast('DEMO: visita calculada (no se guardó en nube). Estado: '+estado); renderHome(); return; }
  try{
    const {collection,addDoc}=window._fs;
    const {ref,uploadString,getDownloadURL}=window._st;
    // upload photos: foto_espacio = ANTES (paso 1), foto_final = DESPUES (paso 3)
    const stamp=Date.now();
    if(visit.foto_espacio){ const r=ref(storage,`visitas/${rec.uid}/${stamp}_antes.jpg`); await uploadString(r,visit.foto_espacio,'data_url'); rec.foto_antes=await getDownloadURL(r); }
    if(visit.foto_final){ const r=ref(storage,`visitas/${rec.uid}/${stamp}_despues.jpg`); await uploadString(r,visit.foto_final,'data_url'); rec.foto_despues=await getDownloadURL(r); }
    await addDoc(collection(db,'visitas'),rec);
    toast('✓ Visita guardada · '+(apto?'Pendiente de aprobación':'Por mejoras'));
    renderHome();
  }catch(e){ toast('Error al guardar: '+(e.code||e.message)); }
};

/* ---------- boot ---------- */
initFirebase();
</script>
